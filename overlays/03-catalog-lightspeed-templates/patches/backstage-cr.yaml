apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: developer-hub
  namespace: rhdh
spec:
  application:
    appConfig:
      configMaps:
        - name: app-config-rhdh
        - name: app-config-auth
        - name: app-config-catalog
        - name: app-config-lightspeed
    extraFiles:
      configMaps:
        - name: lightspeed-stack
          mountPath: /app-root
          key: lightspeed-stack.yaml
          containers:
            - lightspeed-core
    extraEnvs:
      envs:
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
      secrets:
        - name: gitlab-token
        - name: argocd-password
        - name: kubernetes-sa-token
        - name: oauth-client
        - name: backend-secret
        - name: mcp-secret
        - name: sonarqube-token
        - name: llama-stack-secrets
          containers:
            - lightspeed-core
  deployment:
    patch:
      spec:
        template:
          spec:
            volumes:
              - $patch: replace
                name: dynamic-plugins-root
                persistentVolumeClaim:
                  claimName: dynamic-plugins-root
              - emptyDir: {}
                name: shared-storage
              - emptyDir: {}
                name: rag-data-volume
