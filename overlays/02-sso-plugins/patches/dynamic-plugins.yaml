kind: ConfigMap
apiVersion: v1
metadata:
  name: dynamic-plugins
  namespace: rhdh
data:
  dynamic-plugins.yaml: |
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-quickstart
        disabled: true

      - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-bulk-import-backend-dynamic
        disabled: false
      - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-bulk-import
        disabled: false

      # GitLab
      - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-gitlab-dynamic
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-gitlab-dynamic
        disabled: false
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/immobiliarelabs-backstage-plugin-gitlab:bs_1.45.3__6.13.0'
        integrity: 'sha256:36b15f74c207839bd59de964030867b5ef7cfadb80fadf38b87d401c7aac5cf1'
        disabled: false
        # Disable GitLab CI/CD pipelines card - we use Tekton (OpenShift Pipelines)
        pluginConfig:
          dynamicPlugins:
            frontend:
              immobiliarelabs.backstage-plugin-gitlab:
                mountPoints:
                  # Disable GitLab CI/CD pipelines card - we use Tekton (OpenShift Pipelines)
                  - mountPoint: entity.page.ci/cards
                    importName: EntityGitlabPipelinesContent
                    config:
                      if:
                        allOf:
                          - isGitlabAvailable
                          - false  # Force disable
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/immobiliarelabs-backstage-plugin-gitlab-backend:bs_1.45.3__6.13.0'
        integrity: 'sha256:0c5b9ade408c824e957a683e808195177936c58928cd0ee25724079abff53cda'
        disabled: false

      # Argo CD
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-backstage-plugin-argo-cd-backend:bs_1.45.3__4.6.0
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd:bs_1.45.3__2.4.4
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-scaffolder-backend-argocd:bs_1.45.3__1.8.1
        disabled: false

      # Kubernetes
      - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes-backend-dynamic
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-community-plugin-topology
        disabled: false

      # Tekton
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton:bs_1.45.3__3.33.3
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              backstage-community.plugin-tekton:
                mountPoints:
                - config:
                    if:
                      allOf:
                      - isTektonCIAvailable
                    layout:
                      gridColumn: 1 / -1
                      gridRowStart: 1
                  importName: TektonCI
                  mountPoint: entity.page.ci/cards

      # Keycloak
      - package: ./dynamic-plugins/dist/backstage-community-plugin-catalog-backend-module-keycloak-dynamic
        disabled: false

      # JIRA plugin (frontend overview card)
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-backstage-plugin-jira:bs_1.45.3__2.14.0
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              roadiehq.backstage-plugin-jira:
                mountPoints:
                  - mountPoint: entity.page.overview/cards
                    importName: EntityJiraOverviewCard
                    config:
                      layout:
                        gridColumn: 1 / -1
                      if:
                        allOf:
                          - hasAnnotation: jira/project-key

      # SonarQube plugin
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-sonarqube:bs_1.45.3__0.21.0
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-sonarqube-backend:bs_1.45.3__0.15.0
        disabled: false

      - disabled: false
        package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-global-header
        pluginConfig:
          app:
            sidebar:
              search: false
              settings: false
          dynamicPlugins:
            frontend:
              default.main-menu-items:
                menuItems:
                  default.create:
                    title: ''
              red-hat-developer-hub.backstage-plugin-global-header:
                mountPoints:
                  - mountPoint: application/header
                    importName: GlobalHeader
                    config:
                      position: above-main-content
                  - mountPoint: global.header/component
                    importName: SearchComponent
                    config:
                      priority: 100
                  - mountPoint: global.header/component
                    importName: Spacer
                    config:
                      priority: 99
                      props:
                        growFactor: 0
                  - mountPoint: global.header/component
                    importName: HeaderIconButton
                    config:
                      priority: 90
                      props:
                        title: Self-service
                        icon: add
                        to: create
                  - mountPoint: global.header/component
                    importName: StarredDropdown
                    config:
                      priority: 85
                  - mountPoint: global.header/component
                    importName: ApplicationLauncherDropdown
                    config:
                      priority: 82
                  - mountPoint: global.header/component
                    importName: SupportButton
                    config:
                      priority: 80
                  - mountPoint: global.header/component
                    importName: Divider
                    config:
                      priority: 50
                  - mountPoint: global.header/component
                    importName: ProfileDropdown
                    config:
                      priority: 10
                  - mountPoint: global.header/profile
                    importName: MenuItemLink
                    config:
                      priority: 100
                      props:
                        title: Settings
                        link: /settings
                        icon: manageAccounts
                  - mountPoint: global.header/profile
                    importName: LogoutButton
                    config:
                      priority: 10
                  - mountPoint: global.header/application-launcher
                    importName: MenuItemLink
                    config:
                      section: Developer Tools
                      priority: 90
                      props:
                        title: DevSpaces
                        link: https://devspaces.{{ cluster_subdomain }}
                  - mountPoint: global.header/application-launcher
                    importName: MenuItemLink
                    config:
                      section: Developer Tools
                      priority: 80
                      props:
                        title: GitLab
                        link: https://gitlab-gitlab.{{ cluster_subdomain }}
                  - mountPoint: global.header/application-launcher
                    importName: MenuItemLink
                    config:
                      section: Developer Tools
                      priority: 80
                      props:
                        title: Quay
                        link: https://quay.{{ cluster_subdomain }}
