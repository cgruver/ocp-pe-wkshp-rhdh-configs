kind: ConfigMap
apiVersion: v1
metadata:
  name: app-config-auth
  namespace: rhdh
  labels:
    app.kubernetes.io/name: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  app-config-auth.yaml: |
    signInPage: oidc
    auth:
      session:
        secret: ${BACKEND_SECRET}
      environment: production
      providers:
        oidc:
          production:
            prompt: login
            metadataUrl: https://sso.{{ cluster_subdomain }}/realms/backstage/.well-known/openid-configuration
            clientId: ${OAUTH_CLIENT_ID}
            clientSecret: ${OAUTH_CLIENT_SECRET}
            signIn:
              resolvers:
                - resolver: preferredUsernameMatchingUserEntityName

    backend:
      auth:
        externalAccess:
          - type: static
            options:
              token: ${BACKEND_SECRET}
              subject: api-access
          - type: static
            options:
              token: ${MCP_SECRET}
              subject: mcp-clients

    integrations:
      gitlab:
        - apiBaseUrl: https://gitlab-gitlab.{{ cluster_subdomain }}/api/v4
          baseUrl: https://gitlab-gitlab.{{ cluster_subdomain }}
          host: gitlab-gitlab.{{ cluster_subdomain }}
          token: ${GITLAB_TOKEN}

    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Template, Domain]
      providers:
        keycloakOrg:
          default:
            baseUrl: https://sso.{{ cluster_subdomain }}
            realm: backstage
            loginRealm: backstage
            clientId: ${KEYCLOAK_PLUGIN_CLIENT_ID}
            clientSecret: ${KEYCLOAK_PLUGIN_CLIENT_SECRET}
            schedule:
              frequency: { minutes: 2 }
              timeout: { minutes: 1 }
              initialDelay: { seconds: 15 }
        gitlab:
          gitlab:
            host: gitlab-gitlab.{{ cluster_subdomain }}
            branch: main
            fallbackBranch: main
            entityFilename: catalog-info.yaml
            schedule:
              frequency: { minutes: 5 }
              timeout: { minutes: 3 }

    argocd:
      appLocatorMethods:
        - type: config
          instances:
            - name: main
              url: https://openshift-gitops-server-openshift-gitops.{{ cluster_subdomain }}
              username: admin
              password: ${ARGOCD_OPENSHIFT_GITOPS_PASSWORD}
            - name: apps
              url: https://rhdh-gitops-server-rhdh-gitops.{{ cluster_subdomain }}
              username: admin
              password: ${ARGOCD_RHDH_GITOPS_PASSWORD}

    jira:
      proxyPath: /jira/api
      product: datacenter

    sonarqube:
      baseUrl: https://sonarqube-sonarqube.{{ cluster_subdomain }}
      apiKey: ${SONARQUBE_TOKEN}
      authType: Bearer

    proxy:
      endpoints:
        '/jira/api':
          target: http://jira-stub.rhdh.svc.cluster.local:8080
          headers:
            Accept: application/json
            Content-Type: application/json
            X-Atlassian-Token: nocheck
          allowedMethods: ['GET', 'POST']

    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - clusters:
            - name: dev-cluster
              url: {{ kubernetes_api_url }}
              authProvider: serviceAccount
              skipTLSVerify: true
              serviceAccountToken: ${KUBERNETES_SA_TOKEN}
          type: config
      customResources:
        - group: tekton.dev
          apiVersion: v1beta1
          plural: pipelineruns
        - group: tekton.dev
          apiVersion: v1beta1
          plural: taskruns
        - group: route.openshift.io
          apiVersion: v1
          plural: routes
